---
# ghostmedia (VM 115, homeservertoo), created 2026-11-04 from docker-template 268.
# Media stack moved here from utility on 2026-11-04 so it no longer shares utility's fate.
# Libraries are on the NAS; only app state lives on this VM's disk.

backup_paths:
  - /home/ghost/media/navidrome     # navidrome.db (users, play counts, playlists)
  - /home/ghost/media/music app        # music app.db + config.xml
  - /home/ghost/media/tv app        # tv app.db + config.xml
  - /home/ghost/media/movie app        # movie app.db + config.xml
  - /home/ghost/media/discovery app        # discovery app database + settings (once it runs)

# SQLite written live: paused for the seconds their folders are archived.
backup_pause_containers:
  - navidrome
  - music app
  - tv app
  - movie app

docker_daemon_extra:
  dns: ["10.10.10.1", "1.1.1.1"]
  dns-opts: ["ndots:0"]
