---
# VMs created by proxmox-vm.yml. Convention: VMID = last octet of the IP.
# template: docker-template on that node (homeserver 168, homeservertoo 268).
vms:
  ghostmedia:
    vmid: 115
    node: homeservertoo
    template: 268
    ip: 10.10.10.115
    cores: 4
    memory: 6144        # MB
    disk: 64G
    storage: local-lvm
    tags: [docker, media]
    description: >-
      Media and apps off utility (2026-11-04): the media stack.
      Lives on homeservertoo so the media stack survives utility or homeserver going down.
  ghostbots:
    vmid: 117
    node: homeservertoo
    template: 268
    ip: 10.10.10.117
    cores: 4
    memory: 6144        # MB
    disk: 48G
    storage: local-lvm
    tags: [docker, bots]
    description: >-
      Custom-built bots and services (2026-11-07): Discord bots, notifiers, the notebooks
      and other home-made stacks, gathered off utility, ghostgpu and Jarvis so the
      infrastructure VMs only run infrastructure and the bots run while Jarvis sleeps.
