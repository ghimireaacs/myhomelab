      {
       "id": 46,
       "type": "stat",
       "title": "Exporter Up",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "h": 4,
        "w": 3,
        "x": 0,
        "y": 1
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "up{job=\"opnsense\"}",
         "instant": true
        }
       ],
       "options": {
        "colorMode": "background",
        "graphMode": "area",
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ],
         "values": false
        },
        "justifyMode": "center"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "decimals": 0,
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "red",
            "value": null
           },
           {
            "color": "green",
            "value": 1
           }
          ]
         }
        },
        "overrides": []
       }
      },
