apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: infra
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: homelab
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /etc/grafana/dashboards
---
