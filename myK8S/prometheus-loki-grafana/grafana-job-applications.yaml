         "rawQuery": true,
         "rawSql": "SELECT c.name AS \"Company\", count(*) AS \"Apps\", string_agg(DISTINCT ja.status, ', ') AS \"Statuses\", max(ja.last_activity_at)::date AS \"Last activity\" FROM job_applications ja JOIN companies c ON c.id=ja.company_id GROUP BY c.name ORDER BY max(ja.last_activity_at) DESC",
         "format": "table"
        }
