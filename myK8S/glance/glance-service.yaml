# Stage 1 of the k3s retirement (2026-11-01): Glance runs as Compose on utility
# (docker/glance). This Service has no selector; the EndpointSlice below sends the existing
# glance-ingress (same host and TLS secret) to utility. The glance Deployment is scaled to 0.
# Rollback: restore the selector version from git, then scale the deployment back to 1.
apiVersion: v1
kind: Service
metadata:
  name: glance-svc
  namespace: personal
spec:
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8090
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: glance-utility
  namespace: personal
  labels:
    kubernetes.io/service-name: glance-svc
addressType: IPv4
ports:
  - name: http
    port: 8090
    protocol: TCP
endpoints:
  - addresses:
      - "${GLANCE_IP}"
    conditions:
      ready: true
