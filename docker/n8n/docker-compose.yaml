services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${TZ}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - N8N_LICENSE_AUTO_RENEW_ENABLED=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_METRICS=false
      - N8N_FEATURE_FLAGS_ENABLED=false
      - N8N_INSIGHTS_ENABLED=false
      - N8N_LOG_LEVEL=warn
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
      - N8N_RUNNERS_ENABLED=false
      # Run history: keep 7 days / 5,000 runs, and compact SQLite at start (2026-11-05: the
      # database had grown to 6.3 GB of failed runs from the retired job pipeline).
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=5000
      - DB_SQLITE_VACUUM_ON_STARTUP=true
    volumes:
      - ${N8N_DATA_PATH}:/home/node/.n8n
      - ${N8N_FILES_PATH}:/files
    networks:
      - cloudflare

networks:
  cloudflare:
    external: true
