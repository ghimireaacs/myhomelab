apiVersion: 1
# Remove datasources that were created in the UI or by the k3s setup and no longer have a
# backend: jobs_applied (career-postgres, retired 2026-11-01) and InfluxDB (never deployed).
deleteDatasources:
  - name: jobs_applied
    orgId: 1
  - name: InfluxDB
    orgId: 1
datasources:
- name: Prometheus
  type: prometheus
  uid: prometheus
  url: http://prometheus:9090
  access: proxy
  isDefault: true
  editable: false
- name: Loki
  type: loki
  uid: loki
  url: http://loki:3100
  access: proxy
  editable: false
- name: Graphite
  type: graphite
  uid: graphite
  url: http://graphite:80
  access: proxy
  editable: false
  jsonData:
    graphiteVersion: "1.1"
