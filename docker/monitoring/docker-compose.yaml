# Monitoring: Prometheus, Loki, Grafana (+ image renderer). Ported from k3s (infra), 2026-11-02.
# Start with ./render.sh (renders prometheus.yml from the template, then `docker compose up -d`).
#
# Not ported: syslog-ng and Promtail. Their OPNsense log file stopped receiving data on
# 2026-02-05; OPNsense logs go to Wazuh (defence box) since 2026-10-26, and Promtail is EOL.
# Graphite and the sitespeed dashboard are retired.
# Grafana's SQLite and the Prometheus/Loki data live on the VM's local SSD.
name: monitoring

services:
  prometheus:
    image: prom/prometheus@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    container_name: prometheus
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=300MB
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${MONITORING_DATA_PATH:?set MONITORING_DATA_PATH in .env}/prometheus:/prometheus
    deploy:
      resources:
        limits:
          memory: 512M

  loki:
    image: grafana/loki@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    container_name: loki
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - ${MONITORING_DATA_PATH}/loki:/var/loki
    deploy:
      resources:
        limits:
          memory: 512M

  grafana:
    image: grafana/grafana@sha256:74144189b38447facf737dfd0f3906e42e0776212bf575dc3334c3609183adf7  # 12.2.0
    container_name: grafana
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on: [prometheus, loki, renderer]
    ports:
      - "3001:3000"   # 3000 was Forgejo's on utility
    environment:
      - TZ=Australia/Sydney
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:?set GRAFANA_ROOT_URL in .env}
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Authentik
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid email profile
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=${AUTHENTIK_BASE_URL:?set AUTHENTIK_BASE_URL in .env}/application/o/authorize/
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=${AUTHENTIK_BASE_URL}/application/o/token/
      - GF_AUTH_GENERIC_OAUTH_API_URL=${AUTHENTIK_BASE_URL}/application/o/userinfo/
      - GF_AUTH_SIGNOUT_REDIRECT_URL=${AUTHENTIK_BASE_URL}/application/o/grafana/end-session/
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(groups, 'authentik Admins') && 'Admin' || contains(groups, 'grafana-admins') && 'Admin' || 'Viewer'
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=${GRAFANA_OAUTH_CLIENT_ID:?set GRAFANA_OAUTH_CLIENT_ID in .env}
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GRAFANA_OAUTH_CLIENT_SECRET:?set GRAFANA_OAUTH_CLIENT_SECRET in .env}
      - GF_RENDERING_SERVER_URL=http://renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      - GF_RENDERING_RENDERER_TOKEN=${GRAFANA_RENDERER_TOKEN:?set GRAFANA_RENDERER_TOKEN in .env}
      - GF_RENDERING_VIEWPORT_MAX_WIDTH=3000
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,marcusolsson-json-datasource,marcusolsson-dynamictext-panel
      # Read by the ${...} placeholders in provisioning/alerting/alerting.yaml
      - NTFY_IP=${NTFY_IP:?set NTFY_IP in .env}
      - NTFY_ADMIN_TOKEN=${NTFY_ADMIN_TOKEN:?set NTFY_ADMIN_TOKEN in .env}
    volumes:
      - ${MONITORING_DATA_PATH}/grafana:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    deploy:
      resources:
        limits:
          memory: 512M

  renderer:
    image: grafana/grafana-image-renderer@sha256:a7970b826f6e477461e02bf5463d92634e9ad27d525e4e50296978a2e592d2d7
    container_name: grafana-image-renderer
    restart: unless-stopped
    environment:
      - AUTH_TOKEN=${GRAFANA_RENDERER_TOKEN}
    deploy:
      resources:
        limits:
          memory: 512M
