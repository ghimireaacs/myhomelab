# Media stack (2026-11-01): Navidrome (music server, Subsonic API for Music Assistant and
# phone apps) and youtube-dl-server, moved from k3s. Further services for this host can be added
# in a local docker-compose.override.yaml, which compose merges automatically.
#
# App configs/databases on the VM's local SSD; libraries on the NAS.
name: media

services:
  navidrome:
    image: deluan/navidrome:0.64.2
    container_name: navidrome
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "4533:4533"
    environment:
      - TZ=Australia/Sydney
      - ND_MUSICFOLDER=/music
      - ND_DATAFOLDER=/data
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
      - ND_BASEURL=
      - ND_REVERSEPROXYWHITELIST=172.16.0.0/12
    volumes:
      - ${MEDIA_CONFIG_PATH:?set MEDIA_CONFIG_PATH in .env}/navidrome:/data
      - ${MUSIC_LIBRARY_PATH:?set MUSIC_LIBRARY_PATH in .env}:/music:ro
    deploy:
      resources:
        limits:
          memory: 512M

  ytdl:
    image: nbr23/youtube-dl-server@sha256:3b367e203c5e477dd1b9d546031c761d8bc8c088518b1ec71675c4393e3feaf4
    container_name: youtube-dl-server
    restart: unless-stopped
    ports:
      - "8888:8080"
    environment:
      - TZ=Australia/Sydney
    volumes:
      - ./ytdl:/app_config:ro
      - ${YTDL_DOWNLOAD_PATH:?set YTDL_DOWNLOAD_PATH in .env}:/youtube-dl
    deploy:
      resources:
        limits:
          memory: 512M
